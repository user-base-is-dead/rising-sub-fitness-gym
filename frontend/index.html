<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="src/assets/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      const originalInfo = console.info;
      console.info = function(...args) {
        if (typeof args[0] === 'string' && args[0].includes('Download the React DevTools')) {
          return;
        }
        originalInfo.apply(console, args);
      };

      // Lock Inspect Option
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      document.addEventListener('keydown', (e) => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) ||
          (e.ctrlKey && ['U', 'u'].includes(e.key)) ||
          (e.metaKey && e.altKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) ||
          (e.metaKey && ['U', 'u'].includes(e.key))
        ) {
          e.preventDefault();
        }
      });
    </script>
    <meta
      name="description"
      content="Rising Sun Fitness — Jajpur Town's most hardcore gym. Bodybuilding, Personal Training, Yoga, Cardio Zone. Forge Your Legacy."
    />
    <meta
      name="keywords"
      content="gym, fitness, bodybuilding, yoga, personal training, Jajpur Town, Odisha, Rising Sun Fitness"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Rising Sun Fitness | Forge Your Legacy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
